_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "Convert currencies using historical exchange rates"
summary: "Enter an amount, two currencies, and a date. The agent looks up ECB reference rates and calculates the conversion. Weekends and holidays use the latest earlier published rates. Data covers January 4, 1999 to October 26, 2026."
highlights:
  - "Use currency codes or English names, such as USD or Japanese yen"
  - "See the converted amount and the date of the rates used"
  - "Get a clear reason when a conversion is unavailable"
  - "Every answer is checked against a fixed ECB dataset"
steps:
  - "Ask: Convert 1000 USD to JPY on March 14, 2015"
  - "The agent looks up the currencies and historical rates"
  - "View the conversion and its verification result"
