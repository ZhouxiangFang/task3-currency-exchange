_ > nanoagent.plugin.v0001.ManifestConfig:
id: currency-exchange
name: Currency Exchange
version: 0.2.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  find_currency:
    description: |-
      Look up a currency by ISO code or English name. Pass the task's currency text unchanged.
      Matching ignores case and accents and accepts common plurals, such as US dollars.
      Returns {"name", "currencies": [{"code", "name", "first_date", "last_date"}, ...]}, sorted by code.
      Multiple matches mean the name is ambiguous, such as dollar. Date bounds may contain gaps.
      Unknown names raise "no such currency".
  get_rates:
    description: |-
      Read one day's ECB reference rates. Pass a YYYY-MM-DD date and unique uppercase currency codes.
      Returns {"date", "weekday", "published", "rates": [{"currency", "rate"}, ...]}.
      Each rate is units per euro, stored as decimal text. EUR is "1"; an empty rate means unavailable.
      On days without a publication, published is false and rates is empty.
      Unknown codes, invalid dates, and dates outside 1999-01-04 to 2026-10-26 raise errors.
  calculate:
    description: |-
      Calculate a decimal expression using + - * / and parentheses, such as "1000 * 128.41 / 1.0572".
      Returns {"expression", "value"}, using 28-digit decimal precision.
      Invalid expressions and division by zero raise errors.

# One entry per contract.Task; its input class is contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  convert-currency:
    description: Convert an amount using historical ECB rates, or explain why it cannot be converted.
    runner: agent
    tools: [find_currency, get_rates, calculate]
    reference: null
    instructions: |-
      Submit {"status": ..., "from_currency": ..., "to_currency": ..., "rate_date": ..., "converted": ...}. Every field but status is empty unless status is converted. Check in this order and submit the first status that applies. Make each turn's calls in parallel: turns are limited.
      1. Trim surrounding spaces. If the amount is not a nonnegative decimal such as 1000 or 25.50 (digits required on both sides of a decimal point), submit invalid_amount.
      2. Call find_currency for the from and the to currency. If the from currency's call fails, submit no_such_currency; if it gives several currencies, submit ambiguous_currency. Otherwise do the same for the to currency.
      3. Call get_rates with the unique codes for the date and for each of the four days before it, in parallel. If the call for the date itself fails, submit invalid_date for a date that is not real, or date_out_of_range for one outside the data. Ignore failures for the earlier days.
      4. The rate day is the date if published is true for it, else the latest of the earlier days that is published. If none of them is published, submit date_out_of_range. If the rate day gives an empty rate for either currency, submit no_rate.
      5. Otherwise call calculate on amount * to_rate / from_rate, round the value half up to 2 decimal places, and submit converted with the two codes, the rate day as rate_date, and the rounded amount, such as "121462.35".
